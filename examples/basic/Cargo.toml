# Standalone example crate that consumes `slint-tree-view`.
#
# Run from inside this directory with:
#   cargo run
# (or, from the repo root: cargo run --manifest-path examples/basic/Cargo.toml)
[package]
name = "tree-view-basic-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
description = "Minimal slint-tree-view consumer."

[[bin]]
name = "tree-view-basic-example"
path = "src/main.rs"

[dependencies]
slint = "1.17"
slint-tree-view = { path = "../.." }

[build-dependencies]
slint-build = { version = "1.17", features = ["experimental-module-builds"] }

[workspace]
