name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege — the workflow only checks out code and runs cargo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Fast feedback first: formatting + clippy. No Slint system deps needed
  # for `cargo fmt`; clippy links against Slint so it still needs them.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Slint system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb-cursor-dev libxcb-util-dev \
            libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb-cursor-dev libxcb-util-dev \
            libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # `tests/ui_compiles.rs` compiles `ui/tree_view.slint` via the
        # slint-interpreter; no window/display server is opened.
        run: cargo test --all-targets

  # The example is a `[workspace]`-excluded standalone crate that consumes
  # `slint-tree-view` via `import { ... } from "@TreeView"`. Building it
  # end-to-end exercises the `links = "treeview"` → `DEP_TREEVIEW_SLINT_LIBRARY_*`
  # plumbing that the library unit tests can't reach.
  example:
    name: build example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb-cursor-dev libxcb-util-dev \
            libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "examples/basic"
      - name: cargo build example
        working-directory: examples/basic
        run: cargo build --release

  # NOTE: `Cargo.toml` declares `rust-version = "1.77"`, but the resolved
  # dependency graph requires much more. Slint 1.17 pulls accesskit_winit
  # 0.33.2, whose manifest uses `edition = "2024"` — and edition 2024 only
  # stabilized in Rust 1.85 (https://blog.rust-lang.org/2025/02/20/Rust-1.85.0/).
  # Older Cargo can't even *parse* that manifest, so the MSRV job must be
  # pinned to >= 1.85. Consider bumping `rust-version` in `Cargo.toml` to
  # 1.85 so the declared MSRV matches what actually compiles.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install Slint system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb-cursor-dev libxcb-util-dev \
            libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (MSRV)
        run: cargo build

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Slint system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb-cursor-dev libxcb-util-dev \
            libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps
